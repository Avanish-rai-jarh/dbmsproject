<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CampusBite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --green: #286b45;
            --green-dark: #1f5335;
            --green-light: #e8f1e7;
            --background: #f5f6f0;
            --text: #202720;
            --muted: #778078;
            --border: #e8ebe5;
            --white: #ffffff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 45px 20px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .profile-wrapper {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .page-heading h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 38px);
            letter-spacing: -1px;
        }

        .page-heading p {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .profile-card {
            overflow: hidden;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(32, 55, 35, 0.06);
        }

        .profile-banner {
            height: 115px;
            background:
                radial-gradient(circle at 85% 20%,
                    rgba(255,255,255,.5) 0 35px,
                    transparent 36px),
                linear-gradient(120deg, #dcebd8, #edf3e7);
        }

        .profile-content {
            padding: 0 32px 30px;
        }

        .profile-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 15px;
            margin-top: -40px;
            margin-bottom: 25px;
        }

        .avatar {
            display: flex;
            width: 88px;
            height: 88px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            border: 5px solid white;
            border-radius: 50%;
            background: var(--green);
            color: white;
            font-size: 30px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 9px 12px;
            border-radius: 30px;
            background: var(--green-light);
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39975a;
        }

        .welcome-title {
            margin: 0 0 7px;
            font-size: 23px;
            overflow-wrap: anywhere;
        }

        .welcome-subtitle {
            margin: 0 0 25px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .details-heading {
            margin: 0 0 15px;
            font-size: 15px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .detail-box {
            min-width: 0;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fdfdfb;
        }

        .detail-label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .detail-value {
            display: block;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            min-height: 45px;
            padding: 12px 20px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        #editProfileButton,
        #saveProfileButton {
            background: var(--green);
            color: white;
        }

        #editProfileButton:hover,
        #saveProfileButton:hover {
            background: var(--green-dark);
        }

        .secondary-button {
            border-color: var(--border);
            background: white;
            color: var(--text);
        }

        .secondary-button:hover {
            background: #f5f6f0;
        }

        #editProfileForm {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        #editProfileForm h2 {
            margin: 0 0 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            min-height: 45px;
            padding: 12px;
            border: 1px solid #dfe4dc;
            border-radius: 9px;
            background: white;
            font: inherit;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(40, 107, 69, .1);
        }

        #message {
            margin: 15px 0;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #message.success {
            color: var(--green);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--green);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 520px) {
            body {
                padding: 25px 14px;
            }

            .profile-content {
                padding: 0 18px 22px;
            }

            .profile-banner {
                height: 95px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }

            .avatar {
                width: 76px;
                height: 76px;
                font-size: 25px;
            }

            .status-badge {
                font-size: 11px;
                padding: 8px 10px;
            }

            .detail-box {
                padding: 15px;
            }

            .profile-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <main class="profile-wrapper">

        <header class="page-heading">
            <p class="eyebrow">CampusBite Account</p>
            <h1>My Profile</h1>
            <p>Manage your personal information and account details.</p>
        </header>

        <section class="profile-card">

            <div class="profile-banner"></div>

            <div class="profile-content">

                <div class="profile-top">
                    <div class="avatar" id="profileAvatar">C</div>

                    <span class="status-badge">
                        <span class="status-dot"></span>
                        Logged In
                    </span>
                </div>

                <h2 class="welcome-title">
                    Welcome, <span id="customerNameHeading">Customer</span>
                </h2>

                <p class="welcome-subtitle">
                    Your CampusBite account information.
                </p>

                <p id="message" role="status" aria-live="polite"></p>

                <section id="profileDetails" hidden>

                    <h3 class="details-heading">Personal Information</h3>

                    <div class="profile-details">

                        <div class="detail-box">
                            <span class="detail-label">Customer ID</span>
                            <span class="detail-value" id="customerId"></span>
                        </div>

                        <div class="detail-box">
                            <span class="detail-label">Full Name</span>
                            <span class="detail-value" id="customerName"></span>
                        </div>

                        <div class="detail-box">
                            <span class="detail-label">Email Address</span>
                            <span class="detail-value" id="customerEmail"></span>
                        </div>

                        <div class="detail-box">
                            <span class="detail-label">Phone Number</span>
                            <span class="detail-value" id="customerPhone">
                                Not provided
                            </span>
                        </div>

                    </div>

                    <div class="profile-actions">
                        <button type="button" id="editProfileButton">
                            Edit Profile
                        </button>
                    </div>

                </section>

                <form id="editProfileForm" hidden>

                    <h2>Edit Your Information</h2>

                    <div class="form-group">
                        <label for="editName">Full Name</label>
                        <input
                            type="text"
                            id="editName"
                            maxlength="100"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="editPhone">Phone Number</label>
                        <input
                            type="tel"
                            id="editPhone"
                            maxlength="15"
                            autocomplete="tel"
                            placeholder="Enter your phone number"
                        >
                    </div>

                    <div class="profile-actions">
                        <button type="submit" id="saveProfileButton">
                            Save Changes
                        </button>

                        <button
                            type="button"
                            id="cancelEditButton"
                            class="secondary-button"
                        >
                            Cancel
                        </button>
                    </div>

                </form>

                <a class="back-link" href="index.html">
                    ← Back to CampusBite
                </a>

            </div>
        </section>
    </main>

    <script src="js/customer-profile.js"></script>
</body>
</html>
